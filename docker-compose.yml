# ============================================================
# Xperimne AI Gateway — stack: migrate + app
#
# Reverse proxy: Traefik EKSTERNAL (dijalankan terpisah, di luar
# compose ini) pada network external `internet-net`.
# Referensi: docker-compose.yml rakitdigital.
#
# Database: Postgres SUDAH ADA di host VPS (di luar Docker). App & migrate
# menjangkau via `host.docker.internal` (extra_hosts: host-gateway) →
# port 5432 Postgres host. Pastikan Postgres host:
#   - listen_addresses bukan cuma localhost
#   - pg_hba.conf izinkan subnet Docker (172.16.0.0/12)
#   - firewall VPS buka 5432 untuk subnet Docker
#
# Topologi network (DUA network):
#   - `database-net`   : external (harus dibuat manual di host).
#                            Hanya jalur app/migrate ↔ host Postgres.
#                            DB dijangkau via `host.docker.internal`.
#   - `internet-net`       : external (harus dibuat manual di host).
#                            Hanya `app` yang attach — jalur app ↔ Traefik.
#
# Alur akses: Cloudflare Tunnel → Traefik :80 (HTTP) → app via label.
# TLS/HTTPS ditangani Cloudflare; traefik hanya proxy HTTP.
#
# Syarat:
#   - network external sudah dibuat:
#       docker network create database-net
#       docker network create internet-net
#   - instance Traefik host sudah attach ke `internet-net` dengan entrypoint `web`.
#   - file .env.production berisi APP_DOMAIN, DB_HOST (default host.docker.internal),
#     DB_USERNAME, DB_PASSWORD, DB_DATABASE (acuan: .env.production.example)
#
# Jalankan:  docker compose --env-file .env.production up -d --build
# Migrate otomatis via service `migrate` (jalan sekali, sebelum app up).
# Cron (/api/cron/*, auth Bearer $CRON_SECRET) → jadwalkan dari host cron:
#   0 * * * * curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://APP_DOMAIN/api/cron/expire-packages
#   0 0 1 * *  curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://APP_DOMAIN/api/cron/monthly-reset
# ============================================================

services:
  # Service one-off untuk migrasi database (otomatis sebelum app jalan).
  # DB sudah ada di host VPS — dijangkau via host.docker.internal.
  # Jalankan: docker compose --env-file .env.production up -d --build
  migrate:
    build:
      context: .
      target: builder
    container_name: rdai-migrate
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-rdai-user}:${DB_PASSWORD:?set DB_PASSWORD in .env.production}@${DB_HOST:-host.docker.internal}:5432/${DB_DATABASE:-rdai-db}?schema=public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - database-net
    restart: "no"

  # Prisma CLI manual tersedia DI DALAM image app (runner).
  # Masuk shell:  docker exec -it rdai-app sh
  # Lalu contoh:  npx prisma migrate deploy
  #               npx prisma db push --accept-data-loss
  #               npx prisma db seed
  #               npx prisma studio

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    container_name: rdai-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-rdai-user}:${DB_PASSWORD:?set DB_PASSWORD in .env.production}@${DB_HOST:-host.docker.internal}:5432/${DB_DATABASE:-rdai-db}?schema=public
      HOSTNAME: 0.0.0.0
      PORT: 3035
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=internet-net"
      - "traefik.http.routers.gateway.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env.production}`)"
      - "traefik.http.services.gateway.loadbalancer.server.port=3035"
      - "traefik.http.routers.gateway.entrypoints=web"
    networks:
      - database-net
      - internet-net

volumes:
  uploads:

networks:
  database-net:
    external: true

  internet-net:
    external: true