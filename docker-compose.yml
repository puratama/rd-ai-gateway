# ============================================================
# Xperimne AI Gateway — stack: postgres + migrate + app
#
# Reverse proxy: Traefik EKSTERNAL (dijalankan terpisah, di luar
# compose ini) pada network bersama `internet-net`.
# Referensi: docker-compose.yml rakitdigital.
#
# Alur akses: Cloudflare Tunnel → Traefik :80 (HTTP) → app via label.
# TLS/HTTPS ditangani Cloudflare; traefik hanya proxy HTTP.
#
# Syarat:
#   - network external sudah dibuat:  docker network create internet-net
#   - instance Traefik host sudah attach ke `internet-net` dengan entrypoint `web`.
#   - file .env.production berisi APP_DOMAIN, POSTGRES_PASSWORD, dst.
#     (acuan: .env.production.example)
#
# Jalankan:  docker compose --env-file .env.production up -d --build
# Migrate otomatis via service `migrate` (jalan sekali, setelah postgres healthy).
# Cron (/api/cron/*, auth Bearer $CRON_SECRET) → jadwalkan dari host cron:
#   0 * * * * curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://APP_DOMAIN/api/cron/expire-packages
#   0 0 1 * *  curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://APP_DOMAIN/api/cron/monthly-reset
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: rdai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rdai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-rdai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rdai} -d ${POSTGRES_DB:-rdai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internet-net

  # Service one-off untuk migrasi database (automatis setelah postgres healthy)
  # Jalankan: docker compose --env-file .env.production up -d --build
  migrate:
    build:
      context: .
      target: builder
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rdai}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-rdai}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - internet-net
    restart: "no"

  # Prisma CLI manual tersedia DI DALAM image app (runner).
  # Masuk shell:  docker exec -it rdai-app sh
  # Lalu contoh:  npx prisma migrate deploy
  #               npx prisma db push --accept-data-loss
  #               npx prisma db seed
  #               npx prisma studio

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_INTERNAL_KEY: ${NEXT_PUBLIC_INTERNAL_KEY:-}
    container_name: rdai-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rdai}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-rdai}?schema=public
      HOSTNAME: 0.0.0.0
      PORT: 3035
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env.production}`)"
      - "traefik.http.services.gateway.loadbalancer.server.port=3035"
      - "traefik.http.routers.gateway.entrypoints=web"
    networks:
      - internet-net

volumes:
  pgdata:

networks:
  internet-net:
    external: true