# ============================================================
# Xperimne AI Gateway — stack: postgres + migrate + app
#
# Reverse proxy: Traefik EKSTERNAL (dijalankan terpisah, di luar
# compose ini) pada network external `internet-net`.
# Referensi: docker-compose.yml rakitdigital.
#
# Topologi network (DUA network):
#   - `rd-ai-network`  : bridge lokal, dibuat otomatis compose.
#                            Untuk komunikasi antar service (postgres,
#                            migrate, app). App connect DB via host
#                            `postgres:5432` di network ini.
#   - `internet-net`       : external (harus dibuat manual di host).
#                            Hanya `app` yang attach — jalur app ↔ Traefik.
#
# Alur akses: Cloudflare Tunnel → Traefik :80 (HTTP) → app via label.
# TLS/HTTPS ditangani Cloudflare; traefik hanya proxy HTTP.
#
# Syarat:
#   - network external sudah dibuat:  docker network create internet-net
#   - instance Traefik host sudah attach ke `internet-net` dengan entrypoint `web`.
#   - file .env.production berisi APP_DOMAIN, POSTGRES_PASSWORD, dst.
#     (acuan: .env.production.example)
#
# Akses DB dari luar Docker (opsional, DBeaver/psql di host):
#   postgres publish `0.0.0.0:5444:5432` → localhost:5444.
#   App TIDAK pakai port ini; app tetap via `postgres:5432` (rd-ai-network).
#
# Jalankan:  docker compose --env-file .env.production up -d --build
# Migrate otomatis via service `migrate` (jalan sekali, setelah postgres healthy).
# Cron (/api/cron/*, auth Bearer $CRON_SECRET) → jadwalkan dari host cron:
#   0 * * * * curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://APP_DOMAIN/api/cron/expire-packages
#   0 0 1 * *  curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://APP_DOMAIN/api/cron/monthly-reset
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: rdai-db
    restart: unless-stopped
    ports:
      - 0.0.0.0:5444:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rdai-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-rdai-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rdai-user} -d ${POSTGRES_DB:-rdai-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rd-ai-network

  # Service one-off untuk migrasi database (automatis setelah postgres healthy)
  # Jalankan: docker compose --env-file .env.production up -d --build
  migrate:
    build:
      context: .
      target: builder
    container_name: rdai-migrate
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rdai-user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-rdai-db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - rd-ai-network
    restart: "no"

  # Prisma CLI manual tersedia DI DALAM image app (runner).
  # Masuk shell:  docker exec -it rdai-app sh
  # Lalu contoh:  npx prisma migrate deploy
  #               npx prisma db push --accept-data-loss
  #               npx prisma db seed
  #               npx prisma studio

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    container_name: rdai-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rdai-user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-rdai-db}?schema=public
      HOSTNAME: 0.0.0.0
      PORT: 3035
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env.production}`)"
      - "traefik.http.services.gateway.loadbalancer.server.port=3035"
      - "traefik.http.routers.gateway.entrypoints=web"
    networks:
      - rd-ai-network
      - internet-net

volumes:
  pgdata:
  uploads:

networks:
  rd-ai-network:
    driver: bridge

  internet-net:
    external: true